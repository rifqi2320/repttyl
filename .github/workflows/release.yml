name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update, for example v0.1.2-rc.8"
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  NODE_VERSION: 22

jobs:
  agent:
    name: Agent ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      - name: Build
        working-directory: agent
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          set -euo pipefail
          mkdir -p dist
          ext=""
          if [ "$GOOS" = "windows" ]; then
            ext=".exe"
          fi
          name="repttyl-${RELEASE_TAG}-${GOOS}-${GOARCH}"
          go build -trimpath -ldflags="-s -w" -o "dist/repttyl${ext}" ./cmd/repttyl
          tar -C dist -czf "${name}.tar.gz" "repttyl${ext}"
          sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: agent-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            agent/repttyl-*.tar.gz
            agent/repttyl-*.tar.gz.sha256
          if-no-files-found: error

  cli:
    name: CLI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI
        run: pnpm --filter @repttyl/cli build

      - name: Package CLI
        run: |
          set -euo pipefail
          name="repttyl-client-${RELEASE_TAG}"
          package_root="dist-release/${name}"
          mkdir -p "${package_root}/dist"
          mkdir -p "${package_root}/node_modules/@repttyl/client-node/dist"
          mkdir -p "${package_root}/node_modules/@repttyl/protocol-client/dist"

          cp -R apps/cli/dist/. "${package_root}/dist/"
          cp apps/cli/package.json "${package_root}/package.json"
          cp packages/client-node/package.json "${package_root}/node_modules/@repttyl/client-node/package.json"
          cp -R packages/client-node/dist/. "${package_root}/node_modules/@repttyl/client-node/dist/"
          cp packages/protocol-client/package.json "${package_root}/node_modules/@repttyl/protocol-client/package.json"
          cp -R packages/protocol-client/dist/. "${package_root}/node_modules/@repttyl/protocol-client/dist/"
          chmod +x "${package_root}/dist/main.js"

          tar -C dist-release -czf "${name}.tar.gz" "${name}"
          sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: cli
          path: |
            repttyl-client-*.tar.gz
            repttyl-client-*.tar.gz.sha256
          if-no-files-found: error

  desktop:
    name: Desktop ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    env:
      MACOS_SIGNING_CONFIGURED: ${{ secrets.MACOS_CERTIFICATE_BASE64 != '' && secrets.MACOS_CERTIFICATE_PASSWORD != '' && secrets.APPLE_ID != '' && secrets.APPLE_ID_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' && 'true' || 'false' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            builder-platform: linux
            arch: x64
          - os: macos-15-intel
            platform: darwin
            builder-platform: mac
            arch: x64
          - os: macos-latest
            platform: darwin
            builder-platform: mac
            arch: arm64
          - os: windows-latest
            platform: win32
            builder-platform: win
            arch: x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - name: Warn when macOS signing is disabled
        if: runner.os == 'macOS' && env.MACOS_SIGNING_CONFIGURED != 'true'
        shell: bash
        run: |
          echo "::warning::macOS signing secrets are not configured. Publishing an unsigned DMG."

      - name: Import macOS signing certificate
        if: runner.os == 'macOS' && env.MACOS_SIGNING_CONFIGURED == 'true'
        shell: bash
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          certificate_path="${RUNNER_TEMP}/repttyl-signing.p12"
          keychain_path="${RUNNER_TEMP}/repttyl-signing.keychain-db"

          printf '%s' "${MACOS_CERTIFICATE_BASE64}" | base64 --decode > "${certificate_path}" 2>/dev/null || \
            printf '%s' "${MACOS_CERTIFICATE_BASE64}" | base64 -D > "${certificate_path}"

          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${keychain_path}"
          security import "${certificate_path}" -P "${MACOS_CERTIFICATE_PASSWORD}" -A -t cert -f pkcs12 -k "${keychain_path}"
          security list-keychains -d user -s "${keychain_path}"
          security default-keychain -s "${keychain_path}"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${KEYCHAIN_PASSWORD}" "${keychain_path}"
          security find-identity -v -p codesigning "${keychain_path}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebuild Electron dependencies
        run: pnpm rebuild electron nx

      - name: Build desktop bundles
        run: pnpm --dir apps/desktop run build

      - name: Build desktop artifacts
        env:
          MACOS_SIGNING_ENABLED: ${{ env.MACOS_SIGNING_CONFIGURED }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          pnpm --dir apps/desktop exec electron-builder --config electron-builder.config.js --${{ matrix.builder-platform }} --${{ matrix.arch }} --publish never

      - name: Archive desktop artifacts
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-release
          find apps/desktop/out -maxdepth 1 -type f ! -name "builder-debug.yml" -print0 | while IFS= read -r -d '' file; do
            cp "${file}" "dist-release/$(basename "${file}")"
          done
          if ! find dist-release -maxdepth 1 -type f | grep -q .; then
            echo "No desktop artifacts found"
            find apps/desktop/out -maxdepth 3 -print 2>/dev/null | sort || true
            exit 1
          fi
          for file in dist-release/*; do
            [ -f "${file}" ] || continue
            name="$(basename "${file}")"
            (cd dist-release && shasum -a 256 "${name}" > "${name}.sha256")
          done

      - name: Archive desktop on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-release | Out-Null
          $files = Get-ChildItem -Path apps/desktop/out -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -ne "builder-debug.yml" }
          if ($files.Count -eq 0) {
            Get-ChildItem -Path apps/desktop/out -Recurse -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
            Write-Error "No desktop artifacts found"
          }
          $files | ForEach-Object {
            Copy-Item -Path $_.FullName -Destination "dist-release/$($_.Name)" -Force
            $hash = (Get-FileHash "dist-release/$($_.Name)" -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -FilePath "dist-release/$($_.Name).sha256" -Encoding ascii
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist-release/*
          if-no-files-found: error

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs:
      - agent
      - cli
      - desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t assets < <(find artifacts -type f -print | sort)
          printf '%s\n' "${assets[@]}"
          release_flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            release_flags+=(--prerelease)
          fi

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber \
              "${assets[@]}"
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TAG" \
              --generate-notes \
              "${release_flags[@]}" \
              "${assets[@]}"
          fi
