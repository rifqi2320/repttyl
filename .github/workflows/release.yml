name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update, for example v0.1.2-rc.2"
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  NODE_VERSION: 22

jobs:
  agent:
    name: Agent ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      - name: Build
        working-directory: agent
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          set -euo pipefail
          mkdir -p dist
          ext=""
          if [ "$GOOS" = "windows" ]; then
            ext=".exe"
          fi
          name="repttyl-${RELEASE_TAG}-${GOOS}-${GOARCH}"
          go build -trimpath -ldflags="-s -w" -o "dist/repttyl${ext}" ./cmd/repttyl
          tar -C dist -czf "${name}.tar.gz" "repttyl${ext}"
          sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            agent/repttyl-*.tar.gz
            agent/repttyl-*.tar.gz.sha256
          if-no-files-found: error

  cli:
    name: CLI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI
        run: pnpm --filter @repttyl/cli build

      - name: Package CLI
        run: |
          set -euo pipefail
          name="repttyl-client-${RELEASE_TAG}"
          package_root="dist-release/${name}"
          mkdir -p "${package_root}/dist"
          mkdir -p "${package_root}/node_modules/@repttyl/client-node/dist"
          mkdir -p "${package_root}/node_modules/@repttyl/protocol-client/dist"

          cp -R apps/cli/dist/. "${package_root}/dist/"
          cp apps/cli/package.json "${package_root}/package.json"
          cp packages/client-node/package.json "${package_root}/node_modules/@repttyl/client-node/package.json"
          cp -R packages/client-node/dist/. "${package_root}/node_modules/@repttyl/client-node/dist/"
          cp packages/protocol-client/package.json "${package_root}/node_modules/@repttyl/protocol-client/package.json"
          cp -R packages/protocol-client/dist/. "${package_root}/node_modules/@repttyl/protocol-client/dist/"
          chmod +x "${package_root}/dist/main.js"

          tar -C dist-release -czf "${name}.tar.gz" "${name}"
          sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli
          path: |
            repttyl-client-*.tar.gz
            repttyl-client-*.tar.gz.sha256
          if-no-files-found: error

  desktop:
    name: Desktop ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    env:
      MACOS_SIGNING_CONFIGURED: ${{ secrets.MACOS_CERTIFICATE_BASE64 != '' && secrets.MACOS_CERTIFICATE_PASSWORD != '' && secrets.APPLE_ID != '' && secrets.APPLE_ID_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' && 'true' || 'false' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x64
            package-dir: Repttyl-linux-x64
            archive: tar.gz
          - os: macos-15-intel
            platform: darwin
            arch: x64
            package-dir: Repttyl-darwin-x64
            archive: dmg
          - os: macos-latest
            platform: darwin
            arch: arm64
            package-dir: Repttyl-darwin-arm64
            archive: dmg
          - os: windows-latest
            platform: win32
            arch: x64
            package-dir: Repttyl-win32-x64
            archive: zip
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - name: Warn when macOS signing is disabled
        if: runner.os == 'macOS' && env.MACOS_SIGNING_CONFIGURED != 'true'
        shell: bash
        run: |
          echo "::warning::macOS signing secrets are not configured. Publishing an unsigned DMG."

      - name: Import macOS signing certificate
        if: runner.os == 'macOS' && env.MACOS_SIGNING_CONFIGURED == 'true'
        shell: bash
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          certificate_path="${RUNNER_TEMP}/repttyl-signing.p12"
          keychain_path="${RUNNER_TEMP}/repttyl-signing.keychain-db"

          printf '%s' "${MACOS_CERTIFICATE_BASE64}" | base64 --decode > "${certificate_path}" 2>/dev/null || \
            printf '%s' "${MACOS_CERTIFICATE_BASE64}" | base64 -D > "${certificate_path}"

          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${keychain_path}"
          security import "${certificate_path}" -P "${MACOS_CERTIFICATE_PASSWORD}" -A -t cert -f pkcs12 -k "${keychain_path}"
          security list-keychains -d user -s "${keychain_path}"
          security default-keychain -s "${keychain_path}"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${KEYCHAIN_PASSWORD}" "${keychain_path}"
          security find-identity -v -p codesigning "${keychain_path}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebuild Electron dependencies
        run: pnpm rebuild electron electron-winstaller nx

      - name: Rebuild macOS DMG dependencies
        if: runner.os == 'macOS'
        run: pnpm rebuild fs-xattr macos-alias

      - name: Build desktop dependencies
        run: pnpm --filter @repttyl/client-node build

      - name: Package desktop
        if: matrix.archive != 'dmg'
        run: |
          node -e "require('node:fs').rmSync('apps/desktop/out',{recursive:true,force:true})"
          pnpm --dir apps/desktop exec electron-forge package --platform=${{ matrix.platform }} --arch=${{ matrix.arch }}

      - name: Make desktop DMG
        if: matrix.archive == 'dmg'
        env:
          MACOS_SIGNING_ENABLED: ${{ env.MACOS_SIGNING_CONFIGURED }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          node -e "require('node:fs').rmSync('apps/desktop/out',{recursive:true,force:true})"
          pnpm --dir apps/desktop exec electron-forge make --platform=${{ matrix.platform }} --arch=${{ matrix.arch }}

      - name: Archive desktop on Linux
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-release
          name="repttyl-desktop-${{ matrix.platform }}-${{ matrix.arch }}-${RELEASE_TAG}.tar.gz"
          package_dir=""
          for _ in $(seq 1 60); do
            package_dir=$(find . -path './node_modules' -prune -o -type d \( -name "${{ matrix.package-dir }}" -o -name "*-${{ matrix.platform }}-${{ matrix.arch }}" \) -print -quit)
            [ -n "${package_dir}" ] && break
            sleep 2
          done
          if [ -z "${package_dir}" ]; then
            echo "Could not find ${{ matrix.package-dir }}"
            find . -path './node_modules' -prune -o -type d \( -name '*Repttyl*' -o -name '*desktop*' -o -name '*out*' -o -name '*${{ matrix.platform }}*' \) -print | sort
            exit 1
          fi
          tar -C "$(dirname "${package_dir}")" -czf "dist-release/${name}" "$(basename "${package_dir}")"
          (cd dist-release && sha256sum "${name}" > "${name}.sha256")

      - name: Archive desktop on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-release
          name="repttyl-desktop-${{ matrix.platform }}-${{ matrix.arch }}-${RELEASE_TAG}.dmg"
          dmg_path=""
          for _ in $(seq 1 60); do
            dmg_path=$(find apps/desktop/out -type f -name "*.dmg" -print -quit 2>/dev/null || true)
            [ -n "${dmg_path}" ] && break
            sleep 2
          done
          if [ -z "${dmg_path}" ]; then
            echo "Could not find macOS DMG"
            find apps/desktop/out -maxdepth 6 -print 2>/dev/null | sort || true
            exit 1
          fi
          cp "${dmg_path}" "dist-release/${name}"
          (cd dist-release && shasum -a 256 "${name}" > "${name}.sha256")

      - name: Archive desktop on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-release | Out-Null
          $name = "repttyl-desktop-${{ matrix.platform }}-${{ matrix.arch }}-${env:RELEASE_TAG}.zip"
          $packageDir = $null
          for ($i = 0; $i -lt 60 -and $null -eq $packageDir; $i++) {
            $packageDir = Get-ChildItem -Path . -Directory -Recurse |
              Where-Object {
                $_.FullName -notmatch "\\node_modules\\" -and
                ($_.Name -eq "${{ matrix.package-dir }}" -or $_.Name -like "*-${{ matrix.platform }}-${{ matrix.arch }}")
              } |
              Select-Object -First 1
            if ($null -eq $packageDir) {
              Start-Sleep -Seconds 2
            }
          }
          if ($null -eq $packageDir) {
            Write-Error "Could not find ${{ matrix.package-dir }}"
          }
          Compress-Archive -Path $packageDir.FullName -DestinationPath "dist-release/$name" -Force
          $hash = (Get-FileHash "dist-release/$name" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Out-File -FilePath "dist-release/$name.sha256" -Encoding ascii

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist-release/repttyl-desktop-*
          if-no-files-found: error

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs:
      - agent
      - cli
      - desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t assets < <(find artifacts -type f -print | sort)
          printf '%s\n' "${assets[@]}"
          release_flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            release_flags+=(--prerelease)
          fi

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber \
              "${assets[@]}"
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TAG" \
              --generate-notes \
              "${release_flags[@]}" \
              "${assets[@]}"
          fi
