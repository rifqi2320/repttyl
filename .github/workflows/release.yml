name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  agent:
    name: Agent ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      - name: Build
        working-directory: agent
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          set -euo pipefail
          mkdir -p dist
          ext=""
          if [ "$GOOS" = "windows" ]; then
            ext=".exe"
          fi
          name="repttyl-${GITHUB_REF_NAME}-${GOOS}-${GOARCH}"
          go build -trimpath -ldflags="-s -w" -o "dist/repttyl${ext}" ./cmd/repttyl
          tar -C dist -czf "${name}.tar.gz" "repttyl${ext}"
          sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            agent/repttyl-*.tar.gz
            agent/repttyl-*.tar.gz.sha256
          if-no-files-found: error

  cli:
    name: CLI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI
        run: pnpm --filter @repttyl/cli build

      - name: Package CLI
        run: |
          set -euo pipefail
          name="repttyl-client-${GITHUB_REF_NAME}"
          package_root="dist-release/${name}"
          mkdir -p "${package_root}/dist"
          mkdir -p "${package_root}/node_modules/@repttyl/protocol-client/dist"

          cp -R apps/cli/dist/. "${package_root}/dist/"
          cp apps/cli/package.json "${package_root}/package.json"
          cp packages/protocol-client/package.json "${package_root}/node_modules/@repttyl/protocol-client/package.json"
          cp -R packages/protocol-client/dist/. "${package_root}/node_modules/@repttyl/protocol-client/dist/"
          chmod +x "${package_root}/dist/main.js"

          tar -C dist-release -czf "${name}.tar.gz" "${name}"
          sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli
          path: |
            repttyl-client-*.tar.gz
            repttyl-client-*.tar.gz.sha256
          if-no-files-found: error

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs:
      - agent
      - cli
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          find artifacts -type f -print
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            $(find artifacts -type f -print)
